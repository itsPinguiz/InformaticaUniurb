name: Update contribution index

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  update-index:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - id: material
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, { owner: context.repo.owner, repo: context.repo.repo, pull_number: context.payload.pull_request.number, per_page: 100 });
            return files.some(({ filename }) => /^[123]_[^/]+\/AA \d{4}\//.test(filename));
      - if: github.event_name == 'workflow_dispatch' || steps.material.outputs.result == 'true'
        env:
          CONTRIBUTOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: node .github/scripts/update-contribution-index.mjs
      - if: github.event_name == 'workflow_dispatch' || steps.material.outputs.result == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONTRIBUTING.md
          git diff --cached --quiet || (git commit -m "docs: update material index and contributors" && git push)
