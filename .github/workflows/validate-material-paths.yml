name: Validate material paths

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate new material paths
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node .github/scripts/validate-material-paths.mjs
